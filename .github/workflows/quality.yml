name: Project quality checks

on:
  push:
    branches: [master, "fix/**"]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Check TypeScript
        id: types
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Run automated tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Build application
        id: build
        continue-on-error: true
        run: npm run build

      - name: Run three-day live Dukascopy smoke tests
        id: dukascopy
        continue-on-error: true
        run: |
          smoke_dir="$RUNNER_TEMP/dukascopy-smoke"
          mkdir -p "$smoke_dir"

          for instrument in eurusd xauusd usatechidxusd; do
            npx --yes dukascopy-node@1.51.1 -i "$instrument" -from 2025-01-06 -to 2025-01-09 -t m1 -f csv -dir "$smoke_dir" -fn "$instrument-three-day-smoke" --retries 3 --retry-pause 1000 --retry-on-empty
          done

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import path from "node:path";

          const directory = path.join(process.env.RUNNER_TEMP, "dukascopy-smoke");
          const instruments = ["eurusd", "xauusd", "usatechidxusd"];
          const start = Date.parse("2025-01-06T00:00:00.000Z");
          const end = Date.parse("2025-01-09T00:00:00.000Z");

          for (const instrument of instruments) {
            const file = path.join(directory, `${instrument}-three-day-smoke.csv`);
            const csv = await readFile(file, "utf8");
            const [header, ...lines] = csv.trim().split(/\r?\n/);
            assert.equal(header, "timestamp,open,high,low,close", `${instrument}: unexpected CSV header`);

            const rows = lines.filter(Boolean).map((line) => line.split(",").map(Number));
            assert.ok(rows.length >= 100, `${instrument}: expected at least 100 candles, received ${rows.length}`);

            for (const [timestamp, open, high, low, close] of rows) {
              assert.ok(Number.isInteger(timestamp) && timestamp >= start && timestamp < end, `${instrument}: candle timestamp is outside the requested three-day range`);
              assert.ok([open, high, low, close].every(Number.isFinite), `${instrument}: candle contains a non-finite price`);
              assert.ok(high >= Math.max(open, close), `${instrument}: candle high is below open or close`);
              assert.ok(low <= Math.min(open, close), `${instrument}: candle low is above open or close`);
              assert.ok(high >= low, `${instrument}: candle high is below candle low`);
            }

            console.log(`Verified ${rows.length} ${instrument} M1 candles for 2025-01-06 through 2025-01-08.`);
          }
          NODE

      - name: Fail if any quality check failed
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DUKASCOPY_OUTCOME: ${{ steps.dukascopy.outcome }}
        run: |
          if [ "$LINT_OUTCOME" != "success" ] || [ "$TYPES_OUTCOME" != "success" ] || [ "$TESTS_OUTCOME" != "success" ] || [ "$BUILD_OUTCOME" != "success" ]; then
            echo "A code quality check failed."
            exit 1
          fi
          if [ "$DUKASCOPY_OUTCOME" != "success" ]; then
            echo "::warning::External Dukascopy smoke test failed. This does not fail project checks because the provider may block automated requests (for example, HTTP 403). Local historical CSV and application tests remain authoritative."
          fi
